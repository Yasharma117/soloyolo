<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>soloyolo: LinkedIn sync</title>
  <style>
    :root { --paper: #f6f4ef; --card: #fff; --ink: #16150f; --muted: #6b675e; --line: #e6e2d9; --accent: #e8a317; --bad: #b4441f; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #0e0d0b; --card: #1a1916; --ink: #f2efe8; --muted: #a19c91; --line: #2c2a25; }
    }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 520px; margin: 48px auto; padding: 0 16px; display: grid; gap: 16px; }
    h1 { font-size: 24px; margin: 0; letter-spacing: -0.3px; }
    p { margin: 0; color: var(--muted); }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
    input { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
    code { font-size: 13px; background: var(--paper); padding: 2px 6px; border-radius: 6px; }
    .row { display: flex; gap: 8px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; background: var(--ink); color: var(--paper); }
    button.soft { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { font-size: 14px; color: var(--ink); white-space: pre-line; }
    #status.bad { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <h1>LinkedIn sync</h1>
    <p>Reads your LinkedIn messages through the session in this browser and sends new ones to soloyolo on your Mac. It never sends messages on LinkedIn, and nothing goes anywhere but your Mac.</p>
    <section>
      <label>soloyolo server <input id="server" placeholder="http://127.0.0.1:8765"></label>
      <label>Pairing token <input id="token" type="password" autocomplete="off" placeholder="from python -m spike linkedin-token"></label>
      <p>Run <code>python -m spike linkedin-token</code> on your Mac and paste what it prints.</p>
      <div class="row"><button id="save">Save</button><button id="sync" class="soft">Sync now</button></div>
    </section>
    <section>
      <label>Last sync</label>
      <div id="status">Not synced yet</div>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
